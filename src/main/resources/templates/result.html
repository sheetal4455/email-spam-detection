
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spam Detection Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand" th:href="@{/dashboard}">
            Email Spam Detection
        </a>
    </div>
</nav>

<div class="container mt-5">
    <div class="card shadow p-4">
        <h2 class="text-center text-success mb-4">
            Email Detection Result
        </h2>

        <p>
            <strong>Sender Email:</strong>
            <span th:text="${sender}">Sender</span>
        </p>

        <p>
            <strong>Subject:</strong>
            <span th:text="${subject}">Subject</span>
        </p>

        <p><strong>Email Message:</strong></p>
        <div class="border rounded bg-white p-3 mb-4"
             style="white-space: pre-wrap;"
             th:text="${emailContent}"></div>

        <div class="alert"
             th:classappend="${result == 'Spam' or result == 'SPAM'} ? ' alert-danger' : ' alert-success'">
            <h4>
                Result:
                <span th:text="${result}">Detection Result</span>
            </h4>
            <p class="mb-0">
                Spam Score:
                <span th:text="${score}">0.0</span>
            </p>
        </div>

        <a th:href="@{/dashboard}" class="btn btn-success">
            Back to Dashboard
        </a>
    </div>
</div>

</body>
</html>
