
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Spam Detection Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: #198754;
        }

        .navbar-brand {
            font-weight: bold;
            font-size: 16px;
        }

        .stat-card {
            color: white;
            text-align: center;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.12);
        }

        .total-card {
            background-color: #0d6efd;
        }

        .spam-card {
            background-color: #dc3545;
        }

        .safe-card {
            background-color: #198754;
        }

        .main-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 32px;
            margin-top: 24px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }

        .section-title {
            color: #198754;
            text-align: center;
            margin-bottom: 20px;
        }

        .form-label {
            font-size: 13px;
        }

        .email-message {
            height: 140px;
            resize: vertical;
        }

        .detect-button {
            background-color: #198754;
            border: none;
            color: white;
        }

        .detect-button:hover {
            background-color: #146c43;
            color: white;
        }

        .result-card {
            text-align: center;
        }

        footer {
            margin-top: 40px;
            padding: 12px;
            text-align: center;
            color: #6c757d;
            font-size: 12px;
        }
    </style>
</head>

<body>

<!-- Navigation Bar -->
<nav class="navbar navbar-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/dashboard}">
            📧 Email Spam Detection
        </a>

        <div class="d-flex flex-wrap gap-2">
            <a th:href="@{/history}"
               class="btn btn-warning btn-sm">
                History
            </a>

            <a th:href="@{/export/pdf}"
               class="btn btn-light btn-sm">
                Export PDF
            </a>

            <a th:href="@{/login}"
               class="btn btn-light btn-sm">
                Logout
            </a>
        </div>
    </div>
</nav>

<div class="container mt-3">

    <!-- Dashboard Statistics -->
    <div class="row g-3">

        <div class="col-md-4">
            <div class="stat-card total-card">
                <h6>Total Emails</h6>
                <h3 th:text="${totalEmails != null ? totalEmails : 0}">0</h3>
            </div>
        </div>

        <div class="col-md-4">
            <div class="stat-card spam-card">
                <h6>Spam Emails</h6>
                <h3 th:text="${spamEmails != null ? spamEmails : 0}">0</h3>
            </div>
        </div>

        <div class="col-md-4">
            <div class="stat-card safe-card">
                <h6>Safe Emails</h6>
                <h3 th:text="${safeEmails != null ? safeEmails : 0}">0</h3>
            </div>
        </div>

    </div>

    <!-- Email Detection Form -->
    <div class="main-card">

        <h4 class="section-title">Detect Spam Email</h4>

        <!-- Error Message -->
        <div th:if="${error != null}"
             class="alert alert-danger"
             th:text="${error}">
        </div>

        <form th:action="@{/check}" method="post">

            <div class="mb-3">
                <label for="sender" class="form-label">
                    Sender Email
                </label>

                <input type="email"
                       id="sender"
                       name="sender"
                       class="form-control"
                       placeholder="Enter sender email"
                       th:value="${sender}">
            </div>

            <div class="mb-3">
                <label for="subject" class="form-label">
                    Subject
                </label>

                <input type="text"
                       id="subject"
                       name="subject"
                       class="form-control"
                       placeholder="Enter email subject"
                       th:value="${subject}">
            </div>

            <div class="mb-3">
                <label for="emailContent" class="form-label">
                    Email Message
                </label>

                <textarea id="emailContent"
                          name="emailContent"
                          class="form-control email-message"
                          placeholder="Paste email content here..."
                          required
                          th:text="${emailContent}"></textarea>
            </div>

            <button type="submit"
                    class="btn detect-button w-100">
                Detect Spam
            </button>

        </form>
    </div>

    <!-- Detection Result -->
    <div class="main-card result-card"
         th:if="${result != null}">

        <h4 class="mb-3">Detection Result</h4>

        <p th:if="${sender != null and !sender.isBlank()}">
            <strong>Sender:</strong>
            <span th:text="${sender}"></span>
        </p>

        <p th:if="${subject != null and !subject.isBlank()}">
            <strong>Subject:</strong>
            <span th:text="${subject}"></span>
        </p>

        <p>
            <strong>Spam Score:</strong>
            <span class="text-primary"
                  th:text="${score != null ? score : 0.0}">0.0</span>
        </p>

        <div th:if="${result == 'SPAM'}"
             class="alert alert-danger mb-0">
            🚨 <strong>SPAM EMAIL</strong>
        </div>

        <div th:if="${result == 'NOT SPAM'}"
             class="alert alert-success mb-0">
            ✅ <strong>SAFE EMAIL — NOT SPAM</strong>
        </div>

        <div th:if="${result != 'SPAM' and result != 'NOT SPAM'}"
             class="alert alert-warning mb-0"
             th:text="${result}">
        </div>

    </div>

</div>

<footer>
    Email Spam Detection System
</footer>

</body>
</html>
